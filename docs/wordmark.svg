<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" role="img" aria-labelledby="title description">
  <title id="title">KillerMCP</title>
  <desc id="description">KillerMCP wordmark with Killer in bone white and MCP in red.</desc>
  <defs>
    <style>
      @font-face {
        font-family: "KillerMCP Typewriter";
        src: url("../installer/Assets/Typewriter-A602.ttf") format("truetype");
      }
      .wordmark {
        font-family: "KillerMCP Typewriter", "Courier New", monospace;
        font-size: 142px;
        font-weight: 700;
        letter-spacing: -8px;
        paint-order: stroke fill;
        stroke: #171717;
        stroke-width: 8px;
        stroke-linejoin: round;
      }
    </style>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <text class="wordmark" x="18" y="142" filter="url(#shadow)">
    <tspan fill="#eee8e1">Killer</tspan><tspan fill="#ef3434">MCP</tspan>
  </text>
</svg>
