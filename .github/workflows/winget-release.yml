# A release-triggered run starts seconds after release.ps1 creates the release and uploads its
# assets, and GitHub can throttle the branch push komac needs. That surfaces as "Ref cannot be
# created" or a CreateRef permission error even though the token is fine, so the submit step
# settles first and retries with backoff. Re-running this workflow with the tag is the manual
# retry path and needs no re-release.

name: WinGet Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.5.0)'
        required: true

jobs:
  submit:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Update WinGet validator
        shell: pwsh
        run: |
          # Pinned so a new module release cannot change what runs here without a commit.
          Install-Module Microsoft.WinGet.Client -RequiredVersion 1.29.380 -Scope CurrentUser -Force -Repository PSGallery
          Repair-WinGetPackageManager -Latest
          winget --version
        env:
          # Without a token the module's GitHub release lookup is anonymous and shares the
          # hosted runner's IP rate limit, which fails the job before anything is submitted.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install Komac
        run: |
          # Komac gets the WinGet token, so the exact release is pinned and checked by hash.
          # Moving to a newer Komac is a deliberate change to these two values.
          $version = '2.16.0'
          $expected = 'BDC45BAF028F750DA7519CC8A5F2EAB5DFEF46DFE88650EEB0D0A9BF51446E4F'
          $url = "https://github.com/russellbanks/Komac/releases/download/v$version/komac-$version-x86_64-pc-windows-msvc.exe"
          $komac = Join-Path $env:RUNNER_TEMP 'komac.exe'
          Invoke-WebRequest -Uri $url -OutFile $komac
          $actual = (Get-FileHash -LiteralPath $komac -Algorithm SHA256).Hash
          if ($actual -ne $expected) { Remove-Item -LiteralPath $komac; throw "Komac $version does not match its pinned SHA-256 ($actual)." }
          Add-Content $env:GITHUB_PATH $env:RUNNER_TEMP
        shell: pwsh

      - name: Submit to WinGet
        run: |
          $manifestDirectory = Join-Path $env:RUNNER_TEMP ("winget-" + [guid]::NewGuid())
          ./scripts/New-WinGetManifest.ps1 -Tag $env:RELEASE_TAG -OutputDirectory $manifestDirectory
          winget validate --manifest $manifestDirectory
          if ($LASTEXITCODE -ne 0) { throw "WinGet manifest validation failed." }

          # Let the release settle before asking GitHub for a branch. See the header note.
          if ("${{ github.event_name }}" -eq "release") { Start-Sleep -Seconds 90 }

          # komac picks a fresh branch name every run, so a retry never collides with a
          # half-finished attempt.
          $delays = @(60, 150, 300)
          for ($i = 0; $i -le $delays.Count; $i++) {
              komac submit $manifestDirectory --yes
              if ($LASTEXITCODE -eq 0) { exit 0 }
              if ($i -eq $delays.Count) { break }
              Write-Host "Submit failed with exit $LASTEXITCODE. Retrying in $($delays[$i])s."
              Start-Sleep -Seconds $delays[$i]
          }
          Write-Error "komac submit failed after $($delays.Count + 1) attempts"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        shell: pwsh
