name: Checks

# Every push and pull request builds KillerMCP and runs unsigned checks with isolated fixtures.
# Full installer, update and desktop acceptance stays in scripts/Test-All.ps1 for the disposable lab.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: true

      - name: Version consistency
        shell: pwsh
        run: ./scripts/Test-PluginVersion.ps1

      - name: Build
        shell: pwsh
        run: |
          dotnet build KillerMCP.slnx -c Release
          if ($LASTEXITCODE -ne 0) { throw 'KillerMCP solution build failed.' }

      - name: Workflow checks
        shell: pwsh
        run: ./scripts/Test-Workflows.ps1

      - name: Client checks
        shell: pwsh
        run: |
          dotnet run --project tests/KillerMCP.Clients.Checks/KillerMCP.Clients.Checks.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'KillerMCP client checks failed.' }

      - name: Runtime checks
        shell: pwsh
        run: |
          dotnet run --project tests/KillerMCP.Runtime.Checks/KillerMCP.Runtime.Checks.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'KillerMCP runtime checks failed.' }

      - name: Setup checks
        shell: pwsh
        run: |
          dotnet run --project tests/KillerMCP.Setup.Checks/KillerMCP.Setup.Checks.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'KillerMCP setup checks failed.' }

      - name: Native host checks
        shell: pwsh
        run: |
          node scripts/Test-NativeHost.mjs
          if ($LASTEXITCODE -ne 0) { throw 'KillerMCP native host checks failed.' }

      - name: Review regressions
        shell: pwsh
        run: |
          $env:KILLERMCP_PDF_CHECK_ROOT = Join-Path $env:RUNNER_TEMP 'killermcp-pdf-review'
          foreach ($review in @('--review-child-input', '--review-positional-input', '--review-download-paths', '--review-data-moves', '--review-repair-trust', '--review-async', '--review-adapter-safety', '--review-notes-bridge', '--review-notes-workflows', '--review-integration-pdf', '--review-network-path', '--review-release-gaps', '--review-update-flavor')) {
            dotnet run --project tests/KillerMCP.Runtime.Checks/KillerMCP.Runtime.Checks.csproj -c Release --no-build -- $review
            if ($LASTEXITCODE -ne 0) { throw "KillerMCP review failed: $review" }
          }

      - name: Review driver checks
        shell: pwsh
        run: |
          node scripts/Test-ReviewDrivers.mjs --root (Join-Path $env:RUNNER_TEMP 'killermcp-driver-checks')
          if ($LASTEXITCODE -ne 0) { throw 'KillerMCP review driver checks failed.' }

      - name: Installer review checks
        shell: pwsh
        run: ./scripts/Test-InstallerReview.ps1 -ArtifactRoot (Join-Path $env:RUNNER_TEMP 'killermcp-installer-review')

      - name: Configurator lifetime checks
        shell: powershell
        run: |
          $configurator = Join-Path $pwd 'Configuration/bin/Release/net10.0/KillerMCP.Configure.exe'
          powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/Test-ConfiguratorLifetime.ps1 -ConfiguratorPath $configurator -ScratchPath (Join-Path $env:RUNNER_TEMP 'killermcp-lifetime') -LabMachine $env:COMPUTERNAME
          if ($LASTEXITCODE -ne 0) { throw 'Configurator lifetime check failed.' }
          powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/Test-ConfiguratorLifetime.ps1 -ConfiguratorPath $configurator -ScratchPath (Join-Path $env:RUNNER_TEMP 'killermcp-lifetime-nested') -LabMachine $env:COMPUTERNAME -NestedJob
          if ($LASTEXITCODE -ne 0) { throw 'Nested configurator lifetime check failed.' }

      - name: Repair consent check
        shell: powershell
        run: ./scripts/Test-RepairHello.ps1 -AssemblyPath ./Shell/bin/Release/net48/KillerMCP.Notify.exe
